name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node version and OS
      placeholder: Node 24.11, macOS 26
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem. Use made-up data, never real user data.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
